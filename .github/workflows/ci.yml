name: CI

on:
  push:
    branches:
      - '*-dev'
      - '16-dev-next'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
  workflow_call:

env:
  PUBLISH_NIGHTLY: true

jobs:
  build-debug-apk:
    strategy:
      matrix:
        # Only build the release APK used for personal installs and nightly publishing.
        build-variant:
          - assembleLawnWithQuickstepNightlyRelease
          # Not needed for this personal fork:
          # - assembleLawnWithQuickstepGithubDebug
          # - assembleLawnWithQuickstepPlayDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Configure persistent APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Persistent APK signing is not configured. Add KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD as repository Actions secrets. Refusing to create APKs signed with a temporary runner key."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/key.jks"
          test -s "$GITHUB_WORKSPACE/key.jks"
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/key.jks"
          } > keystore.properties
      - name: Build APK
        run: ./gradlew ${{ matrix.build-variant }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: build/outputs/apk/**/*.apk

  check-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck

  # Removed upstream-only jobs:
  # - send-notifications: official Lawnchair Telegram notifications
  # - crowdin-auto-merge: automatic merging of Crowdin translation PRs
  # Neither is needed for this personal fork.

  # Status check that is required in branch protection rules.
  final-status:
    needs:
      - build-debug-apk
      - check-style
    runs-on: ubuntu-slim
    if: always()
    outputs:
      publish_nightly: ${{ steps.publishing-status.outputs.publish_nightly }}
    steps:
      - name: Check
        run: |
          if [[ '${{ needs.build-debug-apk.result }}' != 'success' || '${{ needs.check-style.result }}' != 'success' ]]; then
            echo "One or more required jobs failed or were skipped."
            exit 1
          fi
          echo "All required jobs completed successfully."
      - id: publishing-status
        run: echo "publish_nightly=${{ env.PUBLISH_NIGHTLY }}" >> "$GITHUB_OUTPUT"

  nightly-release:
    runs-on: ubuntu-latest
    needs: final-status
    if: needs.final-status.outputs.publish_nightly == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && (endsWith(github.ref, '-dev') || github.ref_name == '16-dev-next')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepNightlyRelease
      # Note the # and () symbols are not supported in GitHub Release filenames, even manually
      - name: Export APK_NAME for later use
        run: echo "APK_NAME=Lawnchair.Debug.${{ github.ref_name }}.Nightly-CI_${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7).apk" >> $GITHUB_ENV
      - name: Rename .apk file
        run: mv "./lawnWithQuickstepNightly/release/"*.apk "./$APK_NAME"
      - name: Delete release if exist then create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="nightly-16-dev-next"
          gh release view "$RELEASE_TAG" && gh release delete "$RELEASE_TAG" -y --cleanup-tag
          gh release create "$RELEASE_TAG" "./$APK_NAME" -p -t "Lawnchair Nightly (16-dev-next)" --generate-notes
